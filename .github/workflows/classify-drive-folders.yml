name: OIO Media Folder Classification
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["OIO Drive Candidate Verification"]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: oio-media-folder-classification
  cancel-in-progress: false
jobs:
  classify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Testar parser sem acessar a internet
        run: python -m unittest scripts/test_classify_drive_folders.py -v
      - name: Examinar listagens públicas e classificar mídia
        env:
          MAX_FOLDERS_TO_INSPECT: "195"
          FOLDER_INSPECT_TIMEOUT: "15"
          FOLDER_INSPECT_DELAY: "0.5"
        run: python scripts/classify_drive_folders.py
      - name: Validar regra de catálogo
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("data/discovery-library.json").read_text(encoding="utf-8"))
          allowed={"videos","filmes_series","desenhos_animacoes","musicas"}
          assert all(x.get("category") in allowed for x in p["items"])
          assert all(all(f.get("category") in allowed for f in x["files"]) for x in p["items"])
          print("Pastas com mídia:",p["folders_with_media"])
          print("Arquivos de mídia:",p["media_files"])
          print("Classificações:",p["status_counts"])
          PY
      - name: Commit do catálogo multimídia
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add data/discovery-library.json
          if git diff --cached --quiet; then echo "Sem alterações"; else git commit -m "Classifica pastas públicas por conteúdo multimídia" && git push; fi
