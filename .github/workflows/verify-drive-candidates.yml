name: OIO Drive Candidate Verification

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["OIO Public Drive Discovery"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: oio-drive-candidate-verification
  cancel-in-progress: false

jobs:
  verify:
    # Só verifica após uma descoberta concluída com sucesso ou execução manual.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências existentes
        run: pip install -r requirements.txt

      - name: Verificar candidatos do Google Drive
        env:
          VERIFY_TIMEOUT_SECONDS: "15"
          MAX_VERIFY_ITEMS: "250"
          VERIFY_WORKERS: "4"
          VERIFY_DELAY_SECONDS: "0.4"
        run: python scripts/verify_drive_candidates.py

      - name: Validar relatório
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/drive-verification-report.json").read_text(encoding="utf-8"))
          assert report["checked_total"] <= report["catalog_total"]
          assert isinstance(report["status_counts"], dict)
          assert all(item["media_downloaded"] is False for item in report["items"])
          assert all(item["anonymous_access_confirmed"] is False for item in report["items"])
          print(f"Relatório válido: {report['checked_total']} candidatos")
          print(report["status_counts"])
          PY

      - name: Commit do relatório de verificação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/drive-verification-report.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração no relatório."
          else
            git commit -m "Verifica acessibilidade dos candidatos do Drive"
            git push
          fi
