name: Build TV Drive Catalog
on:
  push:
    paths:
      - "docs/drive.json"
      - "scripts/build_catalog.py"
      - ".github/workflows/build-tv-library.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate catalog and remove duplicates
        run: python scripts/build_catalog.py
      - name: Commit generated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          if git diff --cached --quiet; then
            echo "Catálogo já está atualizado."
          else
            git commit -m "Build TV Drive catalog"
            git push
          fi
